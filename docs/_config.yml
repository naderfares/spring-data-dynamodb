title: Spring Data DynamoDB
email: naderfares@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  The Spring® Data project simplifies building Spring-powered applications by providing a consistent and intuitive programming model for various data access technologies.
  Spring Data DynamoDB integrates Spring with Amazon DynamoDB, a fully managed NoSQL database, enabling seamless data access with familiar Spring abstractions. 
  It supports CRUD operations, declarative queries, and automatic object-to-table mapping, all while leveraging DynamoDB’s scalability and performance. This module makes working with DynamoDB straightforward, allowing developers to focus on building robust and scalable applications with minimal boilerplate code.
baseurl: "/spring-data-dynamodb"
url: "https://naderfares.github.io"
twitter_username: naderfares
github_username: naderfares

# Build settings
theme: minima
plugins:
  - jekyll-feed

